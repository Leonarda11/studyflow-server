services:
  mysql:
    image: mysql:8.4
    container_name: studyflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: studentske_obaveze
      MYSQL_ROOT_PASSWORD: studyflow_root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/studentske_obaveze.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pstudyflow_root"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
